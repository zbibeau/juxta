# Sources de telechargement : le kit va chercher lui-meme les installeurs a l'installation.
# Hebergement : GitHub Releases du depot zbibeau/juxta ("latest" suit la derniere release).
# Nouvelle version Juxta = nouvelle release avec les memes noms de fichiers, rien a changer ici.

# Installeur JuxtaLink (.pkg)
PKG_URL="https://github.com/zbibeau/juxta/releases/latest/download/JuxtaLink_2.2.3_Signe.2.pkg"

# Plugin SSV : zip contenant le dossier <version>/ (ex. 4.1.1.0/ComposantsSV.dll ...)
SSV_URL="https://github.com/zbibeau/juxta/releases/latest/download/4.1.1.0.1.zip"

# Alternative : un seul dossier partage (Dropbox/Drive) contenant les deux ; prioritaire si renseigne
KIT_URL=""

# Nom du dossier de version si les fichiers du plugin sont a la racine du zip
SSV_VERSION="4.1.1.0"
